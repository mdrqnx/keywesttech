<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 457" role="img" aria-label="이행계획 수립: 분기별 이행 과제와 마일스톤을 배치한 로드맵 간트 차트 그래픽">
  <style>
    text { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .blink { animation: blink 2s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 2.4s ease-out both; }
    @keyframes blink { 50% { opacity: 0.35; } }
    @keyframes grow { from { transform: scaleX(0.15); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="bg4" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#0d2f50"/><stop offset="1" stop-color="#041321"/></radialGradient>
    <pattern id="g4" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
    <linearGradient id="ac4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="ac4b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f7fd6"/><stop offset="1" stop-color="#3b9bff"/></linearGradient>
  </defs>
  <rect width="720" height="457" fill="url(#bg4)"/>
  <rect width="720" height="457" fill="url(#g4)"/>

  <rect x="28" y="60" width="664" height="368" rx="16" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/>
  <!-- quarter header -->
  <g font-size="14.3" fill="#7d93ad" letter-spacing="1.5" text-anchor="middle">
    <text x="221" y="94" text-anchor="start">Q1</text><text x="337" y="94" text-anchor="start">Q2</text><text x="453" y="94" text-anchor="start">Q3</text><text x="569" y="94" text-anchor="start">Q4</text>
  </g>
  <g stroke="#fff" stroke-opacity="0.07">
    <path d="M205 104V408M321 104V408M437 104V408M553 104V408M669 104V408"/>
    <path d="M44 104H676"/>
  </g>

  <!-- rows -->
  <g font-size="14.3" fill="#d6ebff" letter-spacing="0.5">
    <text x="52" y="141">우선순위 도출</text>
    <text x="52" y="191">추진 일정</text>
    <text x="52" y="241">자원·예산</text>
    <text x="52" y="291">시스템 구축</text>
    <text x="52" y="341">전환·안정화</text>
    <text x="52" y="391">운영 정착</text>
  </g>
  <g>
    <rect class="grow" x="212" y="126" width="130" height="22" rx="11" fill="url(#ac4)"/>
    <rect class="grow" x="270" y="176" width="150" height="22" rx="11" fill="url(#ac4)" style="animation-delay:.15s"/>
    <rect class="grow" x="300" y="226" width="136" height="22" rx="11" fill="url(#ac4b)" style="animation-delay:.3s"/>
    <rect class="grow" x="380" y="276" width="190" height="22" rx="11" fill="url(#ac4b)" style="animation-delay:.45s"/>
    <rect class="grow" x="500" y="326" width="120" height="22" rx="11" fill="#3b9bff" fill-opacity="0.45" style="animation-delay:.6s"/>
    <rect class="grow" x="560" y="376" width="108" height="22" rx="11" fill="#3b9bff" fill-opacity="0.3" style="animation-delay:.75s"/>
  </g>
  <!-- milestones -->
  <g>
    <path d="M342 116 l8 8 -8 8 -8 -8 z" fill="#2dd4bf"/>
    <path d="M570 266 l8 8 -8 8 -8 -8 z" fill="#2dd4bf"/>
    <path d="M668 366 l8 8 -8 8 -8 -8 z" fill="#5eead4" class="blink"/>
  </g>
  <!-- today marker -->
  <path d="M296 104V408" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="268" y="76" width="56" height="22" rx="11" fill="#2a1d05" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="296" y="91" text-anchor="middle" font-size="12.3" fill="#fbbf24" letter-spacing="1.5">TODAY</text>
</svg>
