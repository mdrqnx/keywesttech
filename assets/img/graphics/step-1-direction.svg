<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 457" role="img" aria-label="방향성 수립: 레이더 스캔으로 환경과 요구사항을 분석해 목표 방향을 설정하는 그래픽">
  <style>
    text { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sweep { transform-box: view-box; transform-origin: 290px 238px; animation: sweep 6s linear infinite; }
    .blink { animation: blink 2.2s ease-in-out infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="bg1" cx="40%" cy="50%" r="80%"><stop offset="0" stop-color="#0d2f50"/><stop offset="1" stop-color="#041321"/></radialGradient>
    <pattern id="g1" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
    <linearGradient id="ac1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="sw1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/></linearGradient>
    <filter id="gl1" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="457" fill="url(#bg1)"/>
  <rect width="720" height="457" fill="url(#g1)"/>

  <!-- radar -->
  <g fill="none" stroke="#7cc4ff">
    <circle cx="290" cy="238" r="170" stroke-opacity="0.14"/>
    <circle cx="290" cy="238" r="124" stroke-opacity="0.18"/>
    <circle cx="290" cy="238" r="78" stroke-opacity="0.24"/>
    <circle cx="290" cy="238" r="32" stroke-opacity="0.3"/>
    <path d="M120 238H460M290 68V408" stroke-opacity="0.12"/>
  </g>
  <g class="sweep">
    <path d="M290 238 L460 238 A170 170 0 0 0 437 153 Z" fill="url(#sw1)"/>
    <path d="M290 238 L460 238" stroke="#2dd4bf" stroke-width="2"/>
  </g>
  <!-- blips -->
  <g>
    <circle cx="362" cy="176" r="5" fill="#67e8f9" class="blink"/>
    <circle cx="214" cy="300" r="4" fill="#3b9bff"/>
    <circle cx="236" cy="150" r="4" fill="#3b9bff" class="blink"/>
    <circle cx="352" cy="320" r="3.5" fill="#7cc4ff"/>
  </g>
  <!-- direction vector -->
  <path d="M290 238 L414 132" stroke="url(#ac1)" stroke-width="4" stroke-linecap="round" filter="url(#gl1)"/>
  <path d="M404 128 L424 124 L418 144 Z" fill="#2dd4bf"/>
  <circle cx="290" cy="238" r="9" fill="url(#ac1)" filter="url(#gl1)"/>
  <!-- target -->
  <g transform="translate(438 110)">
    <circle r="22" fill="none" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <circle r="12" fill="none" stroke="#2dd4bf"/>
    <circle r="4" fill="#2dd4bf"/>
  </g>
  <rect x="470" y="96" width="72" height="26" rx="13" fill="#0a2238" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="506" y="113" text-anchor="middle" font-size="11" fill="#5eead4" letter-spacing="1">GOAL</text>

  <!-- side panel -->
  <rect x="540" y="196" width="152" height="150" rx="14" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.1"/>
  <g font-size="11" letter-spacing="1">
    <circle cx="560" cy="228" r="4" fill="#2dd4bf"/><text x="574" y="232" fill="#d6ebff">ENV</text><text x="676" y="232" text-anchor="end" fill="#5eead4">✓</text>
    <circle cx="560" cy="262" r="4" fill="#2dd4bf"/><text x="574" y="266" fill="#d6ebff">NEEDS</text><text x="676" y="266" text-anchor="end" fill="#5eead4">✓</text>
    <circle cx="560" cy="296" r="4" fill="#3b9bff" class="blink"/><text x="574" y="300" fill="#d6ebff">VECTOR</text><text x="676" y="300" text-anchor="end" fill="#7cc4ff">…</text>
  </g>
  <rect x="556" y="318" width="120" height="6" rx="3" fill="#fff" fill-opacity="0.08"/>
  <rect x="556" y="318" width="84" height="6" rx="3" fill="url(#ac1)"/>
  <text x="28" y="40" font-size="12" fill="#7d93ad" letter-spacing="2">01 · DIRECTION</text>
</svg>
