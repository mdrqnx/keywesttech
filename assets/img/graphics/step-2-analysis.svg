<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 457" role="img" aria-label="현황 분석: IT 시스템 지표를 스캔해 이슈와 개선사항을 찾는 대시보드 그래픽">
  <style>
    text { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .scan { animation: scan 4s ease-in-out infinite alternate; }
    .blink { animation: blink 1.8s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(420px); } }
    @keyframes blink { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="bg2" cx="50%" cy="30%" r="85%"><stop offset="0" stop-color="#0d2f50"/><stop offset="1" stop-color="#041321"/></radialGradient>
    <pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#3b9bff" stop-opacity="0.25"/></linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="scan2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.25"/></linearGradient>
  </defs>
  <rect width="720" height="457" fill="url(#bg2)"/>
  <rect width="720" height="457" fill="url(#g2)"/>

  <!-- chart panel -->
  <rect x="28" y="64" width="470" height="300" rx="16" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/>
  <g stroke="#fff" stroke-opacity="0.07"><path d="M56 120H470M56 180H470M56 240H470M56 300H470"/></g>
  <g>
    <rect x="70" y="232" width="30" height="104" rx="5" fill="url(#bar2)"/>
    <rect x="120" y="196" width="30" height="140" rx="5" fill="url(#bar2)"/>
    <rect x="170" y="214" width="30" height="122" rx="5" fill="url(#bar2)"/>
    <rect x="220" y="160" width="30" height="176" rx="5" fill="url(#bar2)"/>
    <rect x="270" y="122" width="30" height="214" rx="5" fill="#f59e0b" fill-opacity="0.85"/>
    <rect x="320" y="186" width="30" height="150" rx="5" fill="url(#bar2)"/>
    <rect x="370" y="204" width="30" height="132" rx="5" fill="url(#bar2)"/>
    <rect x="420" y="176" width="30" height="160" rx="5" fill="url(#bar2)"/>
  </g>
  <polyline points="85,210 135,176 185,190 235,140 285,100 335,160 385,172 435,150" fill="none" stroke="url(#line2)" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#67e8f9"><circle cx="85" cy="210" r="3.5"/><circle cx="135" cy="176" r="3.5"/><circle cx="185" cy="190" r="3.5"/><circle cx="235" cy="140" r="3.5"/><circle cx="335" cy="160" r="3.5"/><circle cx="385" cy="172" r="3.5"/><circle cx="435" cy="150" r="3.5"/></g>
  <!-- issue marker -->
  <circle cx="285" cy="100" r="14" fill="none" stroke="#f59e0b" class="blink"/>
  <circle cx="285" cy="100" r="5" fill="#f59e0b"/>
  <rect x="304" y="78" width="96" height="26" rx="8" fill="#2a1d05" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="352" y="95" text-anchor="middle" font-size="11" fill="#fbbf24" letter-spacing="1">ISSUE #03</text>
  <!-- scan line -->
  <g class="scan"><rect x="40" y="76" width="44" height="276" fill="url(#scan2)"/><path d="M84 76V352" stroke="#2dd4bf" stroke-opacity="0.7"/></g>

  <!-- side metrics -->
  <g font-size="10.5" letter-spacing="1.5">
    <rect x="520" y="64" width="172" height="90" rx="14" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/>
    <text x="538" y="90" fill="#7d93ad">SYSTEMS</text>
    <text x="538" y="130" font-size="24" font-weight="700" fill="#fff" letter-spacing="0">12</text>
    <text x="580" y="128" fill="#5eead4">scanned</text>

    <rect x="520" y="168" width="172" height="90" rx="14" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/>
    <text x="538" y="194" fill="#7d93ad">CLOUD FIT</text>
    <rect x="538" y="214" width="136" height="8" rx="4" fill="#fff" fill-opacity="0.08"/>
    <rect x="538" y="214" width="98" height="8" rx="4" fill="url(#line2)"/>
    <text x="538" y="244" fill="#d6ebff">assessing…</text>

    <rect x="520" y="272" width="172" height="92" rx="14" fill="#2a1d05" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="538" y="298" fill="#fbbf24">IMPROVE</text>
    <text x="538" y="322" fill="#fde68a" font-size="10" letter-spacing="0.5">▸ perf bottleneck</text>
    <text x="538" y="344" fill="#fde68a" font-size="10" letter-spacing="0.5">▸ legacy module</text>
  </g>

  <!-- bottom log -->
  <rect x="28" y="380" width="664" height="50" rx="12" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/>
  <g font-size="11.5" letter-spacing="0.5">
    <text x="48" y="410" fill="#7cc4ff">$</text>
    <text x="64" y="410" fill="#d6ebff">analyze --target it-systems --report as-is</text>
    <text x="672" y="410" text-anchor="end" fill="#5eead4" class="blink">● running</text>
  </g>
</svg>
