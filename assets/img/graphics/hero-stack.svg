  <linearGradient id="cylSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f3d6b"/><stop offset="0.5" stop-color="#1a5ea8"/><stop offset="1" stop-color="#0b3156"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.5"/><stop offset="1" stop-color="#3b9bff" stop-opacity="0"/></linearGradient>
  <radialGradient id="floor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
