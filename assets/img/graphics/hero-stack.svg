<style>
  text { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .pkt { animation: up 2.6s linear infinite; }
  .pkt.d1 { animation-delay: -0.9s; } .pkt.d2 { animation-delay: -1.7s; }
  .bob { animation: bob 5s ease-in-out infinite; }
  .blink { animation: blink 2.2s ease-in-out infinite; }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
  @keyframes up { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(-128px); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes blink { 50% { opacity: 0.35; } }
  @keyframes ring { 0% { transform: scale(0.7); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
