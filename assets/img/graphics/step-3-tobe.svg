<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 457" role="img" aria-label="To-Be 모델 수립: 현재 구조를 계층형 목표 아키텍처와 클라우드 서비스 모델로 재설계하는 그래픽">
  <style>
    text { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .flow { stroke-dasharray: 4 8; animation: flow 1.2s linear infinite; }
    .blink { animation: blink 2.2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes blink { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="bg3" cx="70%" cy="40%" r="85%"><stop offset="0" stop-color="#0d2f50"/><stop offset="1" stop-color="#041321"/></radialGradient>
    <pattern id="g3" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
    <linearGradient id="ac3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="gl3" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="457" fill="url(#bg3)"/>
  <rect width="720" height="457" fill="url(#g3)"/>
  <text x="28" y="40" font-size="12" fill="#7d93ad" letter-spacing="2">03 · TO-BE MODEL</text>

  <!-- AS-IS: scattered blocks -->
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#7d93ad" letter-spacing="2">AS-IS</text>
  <g fill="#0a2238" stroke="#7cc4ff" stroke-opacity="0.3">
    <rect x="44" y="112" width="74" height="44" rx="8"/>
    <rect x="140" y="128" width="78" height="44" rx="8"/>
    <rect x="58" y="190" width="86" height="44" rx="8"/>
    <rect x="160" y="210" width="64" height="44" rx="8"/>
    <rect x="48" y="276" width="70" height="44" rx="8"/>
    <rect x="138" y="292" width="84" height="44" rx="8"/>
  </g>
  <g stroke="#7cc4ff" stroke-opacity="0.25" fill="none">
    <path d="M118 134 L140 150M101 156 L101 190M179 172 L190 210M144 212 L160 230M83 234 L83 276M118 298 L138 312M192 254 L180 292"/>
    <path d="M118 134 C 200 100, 220 250, 222 300" stroke-dasharray="3 4"/>
  </g>
  <g font-size="9.5" fill="#9fb6cc" text-anchor="middle" letter-spacing="0.5">
    <text x="81" y="138">APP-A</text><text x="179" y="154">APP-B</text><text x="101" y="216">DB-1</text>
    <text x="192" y="236">DB-2</text><text x="83" y="302">BATCH</text><text x="180" y="318">LEGACY</text>
  </g>

  <!-- transform arrow -->
  <path class="flow" d="M250 228 H 330" stroke="#2dd4bf" stroke-width="3" fill="none"/>
  <path d="M328 216 L348 228 L328 240 Z" fill="#2dd4bf"/>
  <rect x="246" y="250" width="104" height="26" rx="13" fill="#0a2238" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <text x="298" y="267" text-anchor="middle" font-size="10" fill="#5eead4" letter-spacing="1">REDESIGN</text>

  <!-- TO-BE: layered architecture -->
  <text x="384" y="86" font-size="11" fill="#7cc4ff" letter-spacing="2">TO-BE</text>
  <!-- cloud -->
  <g transform="translate(600 116)">
    <path d="M-60 26 a22 22 0 0 1 8 -42 a30 30 0 0 1 56 -6 a24 24 0 0 1 40 20 a20 20 0 0 1 -4 28 z" fill="#0d3352" stroke="url(#ac3)" stroke-width="1.5"/>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#d6ebff" letter-spacing="1">CLOUD MODEL</text>
  </g>
  <g>
    <rect x="384" y="160" width="284" height="48" rx="10" fill="#0a2238" stroke="#7cc4ff" stroke-opacity="0.5"/>
    <rect x="384" y="160" width="5" height="48" rx="2" fill="#3b9bff"/>
    <text x="406" y="189" font-size="11" fill="#d6ebff" letter-spacing="1">PRESENTATION</text>
    <g fill="#3b9bff" fill-opacity="0.35"><rect x="560" y="176" width="22" height="16" rx="4"/><rect x="588" y="176" width="22" height="16" rx="4"/><rect x="616" y="176" width="34" height="16" rx="4"/></g>

    <rect x="384" y="218" width="284" height="48" rx="10" fill="#0a2238" stroke="#7cc4ff" stroke-opacity="0.5"/>
    <rect x="384" y="218" width="5" height="48" rx="2" fill="#38a8e8"/>
    <text x="406" y="247" font-size="11" fill="#d6ebff" letter-spacing="1">SERVICE / API</text>
    <g fill="#38a8e8" fill-opacity="0.35"><rect x="560" y="234" width="28" height="16" rx="4"/><rect x="594" y="234" width="28" height="16" rx="4"/><rect x="628" y="234" width="22" height="16" rx="4"/></g>

    <rect x="384" y="276" width="284" height="48" rx="10" fill="#0a2238" stroke="#7cc4ff" stroke-opacity="0.5"/>
    <rect x="384" y="276" width="5" height="48" rx="2" fill="#2dc2c8"/>
    <text x="406" y="305" font-size="11" fill="#d6ebff" letter-spacing="1">DATA</text>
    <g fill="#2dc2c8" fill-opacity="0.35"><rect x="560" y="292" width="40" height="16" rx="4"/><rect x="606" y="292" width="44" height="16" rx="4"/></g>

    <rect x="384" y="334" width="284" height="48" rx="10" fill="url(#ac3)" fill-opacity="0.9" filter="url(#gl3)"/>
    <text x="406" y="363" font-size="11" fill="#fff" letter-spacing="1" font-weight="700">INFRA · PLATFORM</text>
    <text x="650" y="363" text-anchor="end" font-size="10" fill="#e6fffb" class="blink">● ready</text>
  </g>

  <!-- principles -->
  <g font-size="9.5" letter-spacing="1">
    <rect x="44" y="370" width="92" height="26" rx="13" fill="none" stroke="#7cc4ff" stroke-opacity="0.35"/><text x="90" y="387" text-anchor="middle" fill="#9fb6cc">GOALS</text>
    <rect x="144" y="370" width="104" height="26" rx="13" fill="none" stroke="#7cc4ff" stroke-opacity="0.35"/><text x="196" y="387" text-anchor="middle" fill="#9fb6cc">PRINCIPLES</text>
    <rect x="256" y="370" width="98" height="26" rx="13" fill="none" stroke="#7cc4ff" stroke-opacity="0.35"/><text x="305" y="387" text-anchor="middle" fill="#9fb6cc">TASKS</text>
  </g>
</svg>
